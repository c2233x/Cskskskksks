    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

                        brand: {

        body {
            background: #07090e;

                radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),

        .glass-card {

            transform: translateY(-6px) scale(1.01);
            border-color: rgba(99, 102, 241, 0.5);

        .search-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);

        .search-container:focus-within {
            border-color: #6366f1;

        ::-webkit-scrollbar {

            background: #07090e;

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;

    </style>

    <script>
        const REPO_CONFIG = {
            owner: 'c2233x',
            repo: 'Cskskskksks',
            branch: 'main',
            cacheKey: 'gh_games_launcher_cache_v6'
        };

        let state = {
            games: [],
            filteredGames: [],
            isLoading: false,
            lastSha: null
        };

        let isDragging = false;
        let dragMoved = false;
        let startX, startY, initialLeft, initialTop;
        let toastTimeout = null;

        function showToast(message, icon = 'fa-circle-check') {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            if (!toast) return;

            toastMsg.textContent = message;
            toastIcon.className = `fa-solid ${icon} text-brand-400 text-lg`;

            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 3000);
        }

        async function fetchRepoData() {
            const owner = REPO_CONFIG.owner;
            const repo = REPO_CONFIG.repo;
            const branch = REPO_CONFIG.branch;
            const timestamp = Date.now();

            let commitSha = branch;

            try {
                const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/${branch}?_=${timestamp}`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                if (commitRes.ok) {
                    const commitData = await commitRes.json();
                    if (commitData && commitData.sha) {
                        commitSha = commitData.sha;
                    }
                }
            } catch(e) {
                console.error('Error');
            }

            const endpoints = [
                `https://api.github.com/repos/${owner}/${repo}/git/trees/${commitSha}?recursive=1&_=${timestamp}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.github.com/repos/${owner}/${repo}/git/trees/${commitSha}?recursive=1`)}`,
                `https://corsproxy.io/?${encodeURIComponent(`https://api.github.com/repos/${owner}/${repo}/git/trees/${commitSha}?recursive=1`)}`,
                `https://data.jsdelivr.net/v1/packages/gh/${owner}/${repo}@${commitSha}?structure=flat`
            ];

            for (const url of endpoints) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);
                    const res = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        let treeItems = null;

                        if (data.tree && Array.isArray(data.tree) && data.tree.length > 0) {
                            treeItems = data.tree;
                        } else if (data.files && Array.isArray(data.files) && data.files.length > 0) {
                            treeItems = data.files.map(f => ({
                                path: f.name.startsWith('/') ? f.name.slice(1) : f.name,
                                type: 'blob'
                            }));
                        }

                        if (treeItems) {
                            return {
                                sha: data.sha || commitSha,
                                commitSha: commitSha,
                                tree: treeItems
                            };
                        }
                    }
                } catch(e) {
                    console.error('Error');
                }
            }

            return null;
        }

        function formatTitle(str) {
            if (!str) return 'Juego';
            return str
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase())
                .trim();
        }

        async function parseGamesFromTree(treeItems, commitSha) {
            const owner = REPO_CONFIG.owner;
            const repo = REPO_CONFIG.repo;
            const ref = commitSha || REPO_CONFIG.branch;

            const rawBaseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/`;
            const cdnBaseUrl = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/`;

            const htmlFiles = treeItems.filter(item => {
                const path = item.path || item.name || '';
                if (!path || !path.includes('/')) return false;
                const lower = path.toLowerCase();
                return lower.endsWith('.html') || lower.endsWith('.htm');
            });

            if (htmlFiles.length === 0) return [];

            const gameDirsMap = {};

            htmlFiles.forEach(file => {
                const path = file.path || file.name;
                const parts = path.split('/');
                const folderPath = parts.slice(0, -1).join('/');
                
                if (!gameDirsMap[folderPath]) {
                    gameDirsMap[folderPath] = [];
                }
                gameDirsMap[folderPath].push(file);
            });

            const gamesList = [];
            const timestamp = Date.now();

            for (const folderPath in gameDirsMap) {
                const folderHtmls = gameDirsMap[folderPath];

                let mainHtml = folderHtmls.find(f => {
                    const n = (f.path || f.name).split('/').pop().toLowerCase();
                    return n === 'index.html' || n === 'index.htm';
                });

                if (!mainHtml) {
                    mainHtml = folderHtmls.find(f => {
                        const n = (f.path || f.name).split('/').pop().toLowerCase();
                        return n === 'main.html' || n === 'main.htm';
                    });
                }

                if (!mainHtml) {
                    const folderName = folderPath.split('/').pop().toLowerCase();
                    mainHtml = folderHtmls.find(f => {
                        const fileName = (f.path || f.name).split('/').pop();
                        const cleanName = fileName.replace(/\.html?$/i, '').toLowerCase();
                        return cleanName === folderName;
                    });
                }

                if (!mainHtml) {
                    mainHtml = folderHtmls[0];
                }

                const mainHtmlPath = mainHtml.path || mainHtml.name;

                const folderParts = folderPath.split('/');
                const lastFolder = folderParts[folderParts.length - 1];
                const mainFileName = mainHtmlPath.split('/').pop();
                const mainCleanName = mainFileName.replace(/\.html?$/i, '');

                let cleanTitle = '';
                if (mainCleanName.toLowerCase() === 'index' || mainCleanName.toLowerCase() === 'main') {
                    cleanTitle = formatTitle(lastFolder);
                } else {
                    cleanTitle = formatTitle(mainCleanName);
                }

                const prefix = folderPath + '/';
                const gameRelatedFiles = treeItems.filter(item => {
                    const p = item.path || item.name || '';
                    return p.startsWith(prefix);
                });

                const candidateImages = [];
                const imageExtensions = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.ico', '.avif', '.bmp'];
                const priorityKeywords = [
                    'key', 'icono', 'icon', 'cover', 'portada', 'caratula', 
                    'thumb', 'thumbnail', 'preview', 'poster', 'banner', 'logo', 
                    'foto', 'image', 'imagen', 'pic', 'card', 'main'
                ];

                gameRelatedFiles.forEach(item => {
                    const p = item.path || item.name || '';
                    const fileName = p.split('/').pop();
                    const fileNameLower = fileName.toLowerCase();
                    const ext = fileNameLower.includes('.') ? '.' + fileNameLower.split('.').pop() : '';

                    if (imageExtensions.includes(ext)) {
                        const baseName = fileNameLower.replace(/\.[^/.]+$/, '');
                        
                        const isPriority = priorityKeywords.some(kw => 
                            baseName === kw || baseName.startsWith(kw + '-') || baseName.startsWith(kw + '_') || baseName.endsWith('-' + kw) || baseName.endsWith('_' + kw)
                        );

                        const isDirectChild = (p.split('/').length === folderParts.length + 1);

                        candidateImages.push({
                            path: p,
                            fileName: fileName,
                            isPriority: isPriority,
                            isDirectChild: isDirectChild,
                            depth: p.split('/').length
                        });
                    }
                });

                candidateImages.sort((a, b) => {
                    if (a.isPriority !== b.isPriority) return a.isPriority ? -1 : 1;
                    if (a.isDirectChild !== b.isDirectChild) return a.isDirectChild ? -1 : 1;
                    if (a.depth !== b.depth) return a.depth - b.depth;
                    return a.path.length - b.path.length;
                });

                let iconPath = candidateImages.length > 0 ? candidateImages[0].path : null;

                let versionPath = null;
                gameRelatedFiles.forEach(item => {
                    const p = item.path || item.name || '';
                    const fileName = p.split('/').pop().toLowerCase();
                    
                    if (
                        fileName === 'version.txt' || fileName === 'version' || fileName === 'ver.txt' || fileName === 'ver' ||
                        fileName === 'v.txt' || fileName === 'version.json' || fileName === 'info.txt' || fileName === 'info.json' ||
                        fileName === 'build.txt' || fileName === 'version.md' || fileName.startsWith('version') || fileName.startsWith('ver')
                    ) {
                        if (!versionPath || fileName === 'version.txt' || fileName === 'version.json' || fileName === 'ver.txt') {
                            versionPath = p;
                        }
                    }
                });

                const gameUrl = cdnBaseUrl + mainHtmlPath;
                const rawGameUrl = rawBaseUrl + mainHtmlPath;
                const iconUrl = iconPath ? (cdnBaseUrl + iconPath + '?v=' + timestamp) : null;
                const rawIconUrl = iconPath ? (rawBaseUrl + iconPath + '?v=' + timestamp) : null;
                const versionUrl = versionPath ? (cdnBaseUrl + versionPath + '?v=' + timestamp) : null;
                const rawVersionUrl = versionPath ? (rawBaseUrl + versionPath + '?v=' + timestamp) : null;

                gamesList.push({
                    id: folderPath,
                    title: cleanTitle,
                    folderPath: folderPath,
                    htmlPath: mainHtmlPath,
                    gameUrl: gameUrl,
                    rawGameUrl: rawGameUrl,
                    iconPath: iconPath,
                    iconUrl: iconUrl,
                    rawIconUrl: rawIconUrl,
                    versionPath: versionPath,
                    versionUrl: versionUrl,
                    rawVersionUrl: rawVersionUrl,
                    versionText: 'v1.0'
                });
            }

            gamesList.sort((a, b) => a.title.localeCompare(b.title));

            await Promise.all(gamesList.map(async (game) => {
                if (game.versionUrl || game.rawVersionUrl) {
                    const urlsToTry = [game.versionUrl, game.rawVersionUrl].filter(Boolean);
                    for (const vUrl of urlsToTry) {
                        try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 2500);
                            const res = await fetch(vUrl, { signal: controller.signal });
                            clearTimeout(timeoutId);
                            
                            if (res.ok) {
                                const txt = await res.text();
                                let cleaned = txt.trim();
                                
                                if (cleaned.startsWith('{') && cleaned.endsWith('}')) {
                                    try {
                                        const parsedJson = JSON.parse(cleaned);
                                        cleaned = parsedJson.version || parsedJson.ver || parsedJson.v || parsedJson.build || cleaned;
                                    } catch(e) {}
                                }

                                cleaned = String(cleaned).trim().replace(/[\r\n]+/g, ' ').replace(/\.+$/, '');
                                if (cleaned) {
                                    if (!cleaned.toLowerCase().startsWith('v') && !isNaN(parseFloat(cleaned[0]))) {
                                        game.versionText = 'v' + cleaned;
                                    } else {
                                        game.versionText = cleaned;
                                    }
                                    break;
                                }
                            }
                        } catch(e) {
                            console.error('Error');
                        }
                    }
                }
            }));

            return gamesList;
        }

        function loadGamesFromCache() {
            try {
                const cached = localStorage.getItem(REPO_CONFIG.cacheKey);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && Array.isArray(parsed.games) && parsed.games.length > 0) {
                        state.games = parsed.games;
                        state.filteredGames = parsed.games;
                        state.lastSha = parsed.sha || null;
                        renderGamesGrid();
                        return true;
                    }
                }
            } catch(e) {
                console.error('Error');
            }
            return false;
        }

        function saveGamesToCache(sha, games) {
            try {
                const payload = {
                    sha: sha,
                    games: games,
                    timestamp: Date.now()
                };
                localStorage.setItem(REPO_CONFIG.cacheKey, JSON.stringify(payload));
                state.lastSha = sha;
            } catch(e) {
                console.error('Error');
            }
        }

        async function loadRepositoryGames(isManual = false) {
            state.isLoading = true;

            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) {
                refreshIcon.classList.add('fa-spin');
            }

            const hasCache = loadGamesFromCache();

            if (!hasCache) {
                showLoadingState();
            }

            try {
                const repoData = await fetchRepoData();

                if (repoData && repoData.tree) {
                    const freshGames = await parseGamesFromTree(repoData.tree, repoData.commitSha);

                    if (freshGames && freshGames.length > 0) {
                        const hasShaChanged = repoData.sha !== state.lastSha;
                        const hasCountChanged = freshGames.length !== state.games.length;
                        const isDifferent = hasShaChanged || hasCountChanged || JSON.stringify(freshGames) !== JSON.stringify(state.games);

                        if (isDifferent || !hasCache) {
                            state.games = freshGames;
                            applySearchFilter();
                            saveGamesToCache(repoData.sha, freshGames);
                            renderGamesGrid();

                            if (hasCache) {
                                showToast('Actualizado');
                            }
                        } else if (isManual) {
                            showToast('Al día', 'fa-circle-info');
                        }
                    } else if (!hasCache) {
                        showEmptyState('Error de carga', 'Sin juegos.');
                    }
                } else if (!hasCache) {
                    showEmptyState('Error de carga', 'Sin conexión.');
                }
            } catch(err) {
                console.error('Error');
                if (!hasCache) {
                    showEmptyState('Error de carga', 'Sin datos.');
                }
            } finally {
                state.isLoading = false;
                if (refreshIcon) {
                    setTimeout(() => {
                        refreshIcon.classList.remove('fa-spin');
                    }, 300);
                }
            }
        }

        function forceRefreshGames() {
            showToast('Actualizando...', 'fa-rotate-right');
            loadRepositoryGames(true);
        }

        function applySearchFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                state.filteredGames = [...state.games];
            } else {
                state.filteredGames = state.games.filter(g => 
                    g.title.toLowerCase().includes(query) || 
                    g.folderPath.toLowerCase().includes(query)
                );
            }
        }

        function showLoadingState() {
            document.getElementById('loadingGrid').classList.remove('hidden');
            document.getElementById('gamesGrid').classList.add('hidden');
            document.getElementById('emptyContainer').classList.add('hidden');
        }

        function showEmptyState(title, message) {
            document.getElementById('loadingGrid').classList.add('hidden');
            document.getElementById('gamesGrid').classList.add('hidden');
            const empty = document.getElementById('emptyContainer');
            document.getElementById('emptyTitle').textContent = title;
            document.getElementById('emptyMessage').textContent = message || 'Sin resultados.';
            empty.classList.remove('hidden');
            empty.classList.add('flex');
        }

        function renderGamesGrid() {
            document.getElementById('loadingGrid').classList.add('hidden');
            document.getElementById('emptyContainer').classList.add('hidden');

            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (state.filteredGames.length === 0) {
                showEmptyState('Error de carga', 'No se encontraron juegos.');
                return;
            }

            state.filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl p-5 flex flex-col items-center text-center relative overflow-hidden group';

                const firstLetter = game.title ? game.title.charAt(0).toUpperCase() : '🎮';

                const imageHtml = game.iconUrl 
                    ? `<img src="${escapeHtml(game.iconUrl)}" 
                            data-raw-src="${escapeHtml(game.rawIconUrl || '')}" 
                            alt="${escapeHtml(game.title)}" 
                            class="w-full h-full object-cover rounded-2xl group-hover:scale-105 transition-transform duration-300" 
                            onerror="handleImageError(this, '${escapeHtml(game.title)}')">`
                    : `<div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-brand-900/60 to-slate-900 text-brand-400 rounded-2xl p-4 border border-brand-500/20">
                        <span class="text-4xl font-extrabold text-brand-400 mb-1 select-none">${escapeHtml(firstLetter)}</span>
                        <i class="fa-solid fa-gamepad text-lg text-slate-500"></i>
                       </div>`;

                const versionText = game.versionText || 'v1.0';

                card.innerHTML = `
                    <div class="w-full aspect-video rounded-2xl overflow-hidden mb-4 bg-slate-900/90 border border-slate-800/80 relative flex items-center justify-center shadow-inner">
                        ${imageHtml}
                    </div>
                    <h3 class="text-lg font-bold text-white leading-snug line-clamp-1 w-full px-1" title="${escapeHtml(game.title)}">${escapeHtml(game.title)}</h3>
                    
                    <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-500/15 border border-brand-500/30 text-brand-300 text-xs font-semibold tracking-wide shadow-sm">
                        <i class="fa-solid fa-code-branch text-[11px] text-brand-400"></i>
                        <span>${escapeHtml(versionText)}</span>
                    </div>

                    <button onclick="launchGame('${encodeURIComponent(game.gameUrl)}', '${encodeURIComponent(game.rawGameUrl)}')" class="mt-5 w-full py-3 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold text-sm rounded-2xl transition shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 active:scale-95">
                        <i class="fa-solid fa-play text-xs"></i>
                        <span>Jugar</span>
                    </button>
                `;

                grid.appendChild(card);
            });

            grid.classList.remove('hidden');
        }

        function handleImageError(imgEl, title) {
            const rawSrc = imgEl.getAttribute('data-raw-src');
            if (rawSrc && imgEl.src !== rawSrc) {
                imgEl.removeAttribute('data-raw-src');
                imgEl.src = rawSrc;
            } else {
                const parent = imgEl.parentNode;
                if (!parent) return;
                const firstLetter = title ? title.charAt(0).toUpperCase() : '🎮';
                parent.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-brand-900/60 to-slate-900 text-brand-400 rounded-2xl p-4 border border-brand-500/20">
                        <span class="text-4xl font-extrabold text-brand-400 mb-1 select-none">${escapeHtml(firstLetter)}</span>
                        <i class="fa-solid fa-gamepad text-lg text-slate-500"></i>
                    </div>
                `;
            }
        }

        function handleSearch() {
            applySearchFilter();
            renderGamesGrid();
        }

        async function launchGame(encodedCdnUrl, encodedRawUrl) {
            const cdnUrl = decodeURIComponent(encodedCdnUrl);
            const rawUrl = decodeURIComponent(encodedRawUrl);

            document.getElementById('appContainer').style.display = 'none';

            const iframe = document.getElementById('primaryGameIframe');
            const loadingScreen = document.getElementById('gameLoadingScreen');
            loadingScreen.classList.remove('hidden');

            try {
                let response = await fetch(cdnUrl);
                if (!response.ok) {
                    response = await fetch(rawUrl);
                }

                if (response.ok) {
                    let htmlContent = await response.text();

                    const targetUrl = response.url || cdnUrl;
                    const lastSlash = targetUrl.lastIndexOf('/');
                    const baseUrl = targetUrl.substring(0, lastSlash + 1);

                    if (!htmlContent.toLowerCase().includes('<base')) {
                        if (htmlContent.toLowerCase().includes('<head>')) {
                            htmlContent = htmlContent.replace(/<head>/i, `<head><base href="${baseUrl}">`);
                        } else {
                            htmlContent = `<base href="${baseUrl}">${htmlContent}`;
                        }
                    }

                    iframe.srcdoc = htmlContent;
                } else {
                    iframe.src = cdnUrl;
                }
            } catch(e) {
                console.error('Error');
                iframe.src = cdnUrl;
            }

            const primaryView = document.getElementById('primaryGameView');
            primaryView.classList.remove('hidden');
            primaryView.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function hideGameLoadingScreen() {
            document.getElementById('gameLoadingScreen').classList.add('hidden');
        }

        function closePrimaryGame() {
            const iframe = document.getElementById('primaryGameIframe');
            iframe.removeAttribute('srcdoc');
            iframe.src = 'about:blank';

            const primaryView = document.getElementById('primaryGameView');
            primaryView.classList.add('hidden');
            primaryView.classList.remove('flex');

            document.getElementById('appContainer').style.display = 'flex';
            document.body.style.overflow = '';
        }

        function initDraggableBtn() {
            const btn = document.getElementById('draggableBackBtn');
            if (!btn) return;

            btn.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', endDrag);

            btn.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('touchmove', onDrag, { passive: false });
            document.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            const btn = document.getElementById('draggableBackBtn');
            const event = e.touches ? e.touches[0] : e;
            isDragging = true;
            dragMoved = false;
            startX = event.clientX;
            startY = event.clientY;

            const rect = btn.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
        }

        function onDrag(e) {
            if (!isDragging) return;
            const event = e.touches ? e.touches[0] : e;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                dragMoved = true;
            }

            if (dragMoved) {
                if (e.cancelable) e.preventDefault();
                const btn = document.getElementById('draggableBackBtn');
                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;

                const maxLeft = window.innerWidth - btn.offsetWidth - 12;
                const maxTop = window.innerHeight - btn.offsetHeight - 12;

                newLeft = Math.max(12, Math.min(newLeft, maxLeft));
                newTop = Math.max(12, Math.min(newTop, maxTop));

                btn.style.left = newLeft + 'px';
                btn.style.top = newTop + 'px';
                btn.style.right = 'auto';
                btn.style.bottom = 'auto';
            }
        }

        function endDrag() {
            isDragging = false;
        }

        function handleBackBtnClick() {
            if (dragMoved) return;
            document.getElementById('exitConfirmModal').classList.remove('hidden');
        }

        function closeExitModal() {
            document.getElementById('exitConfirmModal').classList.add('hidden');
        }

        function confirmExitGame() {
            closeExitModal();
            closePrimaryGame();
        }

        function reloadRepository() {
            loadRepositoryGames(true);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeExitModal();
                closePrimaryGame();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            initDraggableBtn();
            loadRepositoryGames();
        });
    </script>
</body>
</html>
