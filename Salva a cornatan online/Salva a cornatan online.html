<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Salva a cornatan — Online</title>
<link rel="icon" type="image/png" href="/El%20Bromas/icono.png">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#box{text-align:center;padding:24px}
#icon{width:96px;height:96px;object-fit:contain;border-radius:18px;margin-bottom:16px}
#title{font-size:22px;font-weight:900}
#version{margin-top:8px;font-size:13px;opacity:.8}
#status{margin-top:18px;font-size:14px}
</style>
</head>
<body>
<div id="box">
<img id="icon" src="/El%20Bromas/icono.png" alt="El Bromas">
<div id="title">Salva a cornatan — Online</div>
<div id="version">Versión <span id="ver">...</span></div>
<div id="status">Cargando modo online...</div>
</div>
<script>
const ONLINE_URL='https://cskskskksks.onrender.com/';
fetch('/El%20Bromas/Version.txt',{cache:'no-store'})
  .then(r=>r.ok?r.text():Promise.reject())
  .then(v=>document.getElementById('ver').textContent=v.trim()||'-')
  .catch(()=>document.getElementById('ver').textContent='1.4.3')
  .finally(()=>setTimeout(()=>window.location.replace(ONLINE_URL),250));
</script>
</body>
</html>
