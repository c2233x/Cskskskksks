<title>El Bromas</title>

<body>
<!-- EL BROMAS ONLINE -->
<style id="online-confirm-style">
#onlineConfirm{display:none;position:fixed;inset:0;z-index:1000000;align-items:center;justify-content:center;background:rgba(0,0,0,.82);font-family:Arial,sans-serif}
#onlineConfirmBox{width:min(320px,88vw);padding:24px 20px;border:2px solid #39ff88;border-radius:18px;background:#080b16;color:#fff;text-align:center;box-shadow:0 0 30px rgba(57,255,136,.35)}
#onlineConfirmTitle{font-size:22px;font-weight:900;margin-bottom:20px}
#onlineConfirmButtons{display:flex;gap:12px;justify-content:center}
#onlineConfirmButtons button{min-width:105px;padding:12px 18px;border:0;border-radius:12px;font-size:17px;font-weight:900;cursor:pointer}
#onlineYes{background:#39ff88;color:#031008}
#onlineNo{background:#333;color:#fff}
</style>
<div id="onlineConfirm" aria-hidden="true"><div id="onlineConfirmBox"><div id="onlineConfirmTitle">Ir online</div><div id="onlineConfirmButtons"><button id="onlineYes" type="button">Si</button><button id="onlineNo" type="button">No</button></div></div></div>
</body>
</html>
