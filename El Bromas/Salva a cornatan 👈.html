<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>El Bromas Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:fixed;top:0;left:0}
#onlineHud{position:fixed;top:12px;right:68px;z-index:60;padding:7px 11px;border:1px solid rgba(0,255,170,.65);border-radius:14px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:800;pointer-events:none}#onlineHud .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00ff88;margin-right:5px}#onlineHud.offline .dot{background:#ff4444}#onlineHud.offline{border-color:rgba(255,70,70,.6)}#onlineName{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:1002;width:min(230px,65vw);padding:8px 12px;border-radius:12px;border:1px solid rgba(0,255,170,.55);background:rgba(0,0,0,.55);color:#fff;text-align:center;outline:none;font-weight:700}
</style>
</head><body>
<div id="onlineHud"><span class="dot"></span><span id="onlineHudText">Conectando...</span></div><input id="onlineName" maxlength="18" placeholder="Tu nombre" value="Jugador"/>
<!-- El cliente completo de 1.3 se carga aquí en producción. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="/socket.io/socket.io.js"></script>
<script>
const MP={socket:null,connected:false,id:null};const hud=document.getElementById('onlineHud'),txt=document.getElementById('onlineHudText'),name=document.getElementById('onlineName');
function hudSet(t,off=false){txt.textContent=t;hud.classList.toggle('offline',off)}
const saved=localStorage.getItem('ElBromasPlayerName');if(saved)name.value=saved;
name.addEventListener('input',()=>localStorage.setItem('ElBromasPlayerName',name.value||'Jugador'));
try{MP.socket=io({transports:['websocket','polling']});MP.socket.on('connect',()=>{MP.connected=true;MP.id=MP.socket.id;hudSet('🟢 Conectado');MP.socket.emit('player:join',{name:name.value||'Jugador'})});MP.socket.on('online:count',n=>hudSet(`🟢 ${n} online`));MP.socket.on('disconnect',()=>{MP.connected=false;hudSet('🔴 Desconectado',true)});MP.socket.on('connect_error',()=>hudSet('🔴 Servidor offline',true))}catch(e){hudSet('🔴 Servidor offline',true)}
</script>
</body></html>
