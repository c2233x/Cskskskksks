<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>El Bromas Online</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial}#online{position:fixed;top:10px;right:10px;z-index:9999;padding:8px 12px;background:#111c;border:1px solid #0f8;border-radius:14px;font-weight:700}#name{position:fixed;top:50px;right:10px;z-index:9999;width:130px;padding:8px;border-radius:8px;border:1px solid #0f8;background:#111c;color:#fff}</style></head><body><div id="online">🟢 0 online</div><input id="name" maxlength="18" value="Jugador" placeholder="Nombre"><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="/socket.io/socket.io.js"></script><script>const socket=io();const name=document.getElementById('name');const online=document.getElementById('online');const remotes=new Map();socket.on('online:count',n=>online.textContent=`🟢 ${n} online`);socket.on('connect',()=>socket.emit('player:join',{name:name.value}));name.addEventListener('change',()=>socket.emit('player:join',{name:name.value}));socket.on('world:players',ps=>{online.textContent=`🟢 ${ps.length} online`;});</script><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div style="text-align:center"><h1>El Bromas Online</h1><p>Servidor conectado.</p><p>Esta versión está enlazada al servidor multijugador.</p></div></div></body></html>
