<!DOCTYPE html>

<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;

        #startScreen {

        #gameTitle {

        #playButton {

        #auraLabel { position: fixed; bottom: 135px; left: 15px; color: #dd88ff; font-size: 11px; font-weight: bold; z-index: 15; display: none; text-shadow: 0 0 6px #000; }

        #semenLabel { position: fixed; bottom: 93px; left: 15px; color: #fff399; font-size: 11px; font-weight: bold; z-index: 15; display: none; text-shadow: 0 0 6px #000; }
        
        #peneCountInfo { position:fixed;bottom:200px;left:15px;color:#ffaa66;font-size:12px;font-weight:bold;z-index:15;display:none;text-shadow:0 0 6px #000; }
        
        #auraPopup {
            position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%);

        #morteroBtn { background: rgba(140,70,0,0.85); border-color: #ffaa44; font-size: 8px; }

        #folderInput { display: none; }

        #githubLoader {
            position: fixed; inset: 0; z-index: 2000; display: none;

            background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
        }
        #githubLoaderBox {
            width: min(430px, 94vw); padding: 24px 20px; border-radius: 16px;
            background: linear-gradient(145deg,#0b1024,#050712);
            border: 2px solid #1683ff; box-shadow: 0 0 35px rgba(0,130,255,.35);
            color: #fff; text-align: center;
        }
        #githubLoaderTitle { font-size: 19px; font-weight: 800; margin-bottom: 12px; }
        #githubLoaderStatus { min-height: 38px; font-size: 12px; color: #cbd7ee; line-height: 1.4; margin-bottom: 12px; word-break: break-word; }
        #githubProgressTrack { width: 100%; height: 18px; border-radius: 10px; overflow: hidden; background: #151b2e; border: 1px solid #33405e; }
        #githubProgressBar { width: 0%; height: 100%; border-radius: 10px; background: linear-gradient(90deg,#0077ff,#00e5ff); transition: width .12s linear; }
        #githubProgressPercent { margin-top: 9px; font-size: 15px; font-weight: 800; }
        #githubProgressCount { margin-top: 5px; font-size: 11px; color: #8ea0c5; }
        #githubLoaderError { display:none; margin-top:12px; color:#ff7777; font-size:12px; line-height:1.4; }
        #githubLog { margin-top:12px; max-height:180px; overflow:auto; background:#07101d; border:1px solid #26364f; border-radius:8px; padding:8px; font-family:monospace; font-size:10px; line-height:1.45; text-align:left; color:#9fe3b1; white-space:pre-wrap; word-break:break-word; }
        #githubRetryBtn { display:none; margin:14px auto 0; padding:9px 18px; border:0; border-radius:9px; background:#1677ff; color:#fff; font-weight:700; }
        
        #interactionPrompt {
            position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 2px solid #00ffaa; border-radius: 8px;
            padding: 8px 16px; color: #00ffaa; font-size: 14px; font-weight: bold;
            z-index: 40; display: none; pointer-events: none;
        }

        #sysRestartBtn {
            position: fixed; top: 15px; right: 15px; width: 44px; height: 44px;
            background: rgba(255, 50, 50, 0.85); border: 2px solid #ffaaaa;
            border-radius: 8px; color: white; font-size: 20px;
            display: none; justify-content: center; align-items: center;
            z-index: 45; cursor: pointer; touch-action: manipulation; box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        #restartModal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 15, 35, 0.95); border: 3px solid #ff4444; border-radius: 12px;
            padding: 20px; width: 300px; text-align: center; color: white;
            z-index: 1001; display: none; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
        }
        #restartModal h3 { margin-bottom: 15px; color: #ff6666; }
        #restartModal p { font-size: 14px; margin-bottom: 20px; color: #ccc; }
        .modalBtn {
            padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px;
            cursor: pointer; width: 45%;
        }
        #btnRestartYes { background: #ff4444; color: white; }
        #btnRestartNo { background: #555; color: white; }
    
/* Barra de carga visible debajo del título */
        #startupProgressTrack { width: min(320px, 78vw); height: 10px; margin-top: 14px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); display: block; }
        #startupProgressBar { width: 0%; height: 100%; border-radius: 8px; background: linear-gradient(90deg,#0077ff,#00e5ff); transition: width .12s linear; }
        #startupProgressPercent { margin-top: 6px; font-size: 11px; color: #cbd7ee; display: block; }
        #loadingText { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 2px; text-align:center; }
#startupProgressTrack { width: min(360px, 78vw); height: 10px; margin-top: 14px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.10); border: 2px solid rgba(0,255,100,.35); box-shadow: 0 0 0 rgba(0,255,100,0); animation: githubReading 1s ease-in-out infinite; }
#startupProgressBar { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg,#00b84a,#39ff88); transition: width .12s linear; }
#startupProgressPercent { margin-top: 6px; font-size: 12px; color: #fff; display: block; font-weight: 800; }
#startupProgressCount { margin-top: 2px; font-size: 12px; color: #fff; display: block; font-weight: 800; letter-spacing: .2px; }
@keyframes githubReading { 0%,100% { border-color: rgba(0,255,100,.30); box-shadow: 0 0 0 rgba(0,255,100,0); } 50% { border-color: rgba(0,255,100,1); box-shadow: 0 0 10px rgba(0,255,100,.65); } }
        @media (orientation: portrait) { #startScreen { width: 100vw; height: 100vh; } }

        /* Pantalla inicial limpia: solo carga, porcentaje, contador y JUGAR. */
        #startScreen { gap: 0; }
        #loadingText { font-size: 24px; font-weight: 800; color: #fff; text-shadow: 0 0 18px rgba(0,255,100,.45); }
        #startupProgressTrack { width: min(320px,78vw); height: 10px; margin-top: 14px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.10); border: 2px solid rgba(0,255,100,.30); animation: startupBarBlink 1s ease-in-out infinite; }
        #startupProgressBar { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg,#00b84a,#39ff88); transition: width .12s linear; }
        #startupProgressPercent, #startupProgressCount { color:#fff; font-weight:700; margin-top:7px; font-size:14px; }
        #startupProgressCount { margin-top:3px; font-size:13px; opacity:.9; }
        @keyframes startupBarBlink { 0%,100% { opacity:.58; box-shadow:0 0 7px rgba(0,255,100,.18); } 50% { opacity:1; box-shadow:0 0 18px rgba(0,255,100,.62); } }
        #startScreen.error #startupProgressTrack { border-color:rgba(255,45,45,.9); animation:startupBarErrorBlink .55s ease-in-out infinite; }
        #startScreen.error #startupProgressBar { background:linear-gradient(90deg,#ff2424,#ff6868)!important; }
        @keyframes startupBarErrorBlink { 0%,100% { opacity:.65; box-shadow:0 0 8px rgba(255,0,0,.25); } 50% { opacity:1; box-shadow:0 0 20px rgba(255,0,0,.7); } }
                #githubLoader, #githubLoaderBox, #githubLoaderTitle, #githubLoaderStatus, #githubProgressTrack, #githubProgressPercent, #githubProgressCount, #githubLoaderError, #githubRetryBtn, #playOfflineBtn, #githubLog, #gameInstructions { display:none!important; }


        /* Interfaz de carga limpia: no mostrar textos técnicos, logs ni botones de respaldo. */
        #githubLoader, #githubLoaderBox, #githubLoaderTitle, #githubLoaderStatus, #githubProgressTrack, #playButton,
        #githubProgressPercent, #githubProgressCount, #githubLoaderError, #githubRetryBtn,
        #playOfflineBtn, #githubLog { display:none!important; }
        #startScreen.error #startupProgressTrack { border-color: rgba(255,70,70,.75)!important; animation: githubErrorPulse 1s ease-in-out infinite!important; }
        #startScreen.error #startupProgressBar { background:#ff3030!important; }
        @keyframes githubErrorPulse { 0%,100%{box-shadow:0 0 0 rgba(255,40,40,0)} 50%{box-shadow:0 0 14px rgba(255,40,40,.55)} }
</style>

        async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function fetchBlobWithProgressOnce(url, onProgress) {
            const response = await fetch(url, { cache: 'no-cache' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const total = Number(response.headers.get('content-length')) || 0;
            if (!response.body) {
                const blob = await response.blob();
                onProgress(1);
                return blob;
            }
            const reader = response.body.getReader();
            const chunks = [];
            let loaded = 0;
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.byteLength;
                onProgress(total ? loaded / total : Math.min(0.92, 0.08 + loaded / (loaded + 1048576)));
            }
            onProgress(1);
            return new Blob(chunks);
        }

        // Reintenta la descarga varias veces antes de rendirse. Esto evita que
        // un corte de red momentáneo (muy común en WiFi/datos móviles) tumbe
        // toda la carga con "Failed to fetch" a mitad de camino.
        async function fetchBlobWithProgress(url, onProgress, retries = 3) {
            let lastError;
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    return await fetchBlobWithProgressOnce(url, onProgress);
                } catch (err) {
                    lastError = err;
                    githubLogMsg(`⚠️ Fallo de red (intento ${attempt}/${retries}) en ${url}: ${err?.message || err}`, 'error');
                    if (attempt < retries) await sleep(800 * attempt);
                }
            }
            throw lastError;
        }

        function githubLogMsg(message, type='info') {
            const stamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'ok' ? '✅' : 'ℹ️';
            const line = `[${stamp}] ${prefix} ${message}`;
            console.log(line);
            if (githubLog) {
                githubLog.textContent += (githubLog.textContent ? '\n' : '') + line;
                githubLog.scrollTop = githubLog.scrollHeight;
            }
        }

        async function githubListFolder(path) {
            const url = GITHUB_CONTENTS_URL + path.split('/').map(encodeURIComponent).join('/') + `?ref=${encodeURIComponent(GITHUB_BRANCH)}`;
            githubLogMsg(`Leyendo carpeta: /${path}/`);
            githubLogMsg(`URL: ${url}`);
            let response;
            let lastNetworkError;
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    response = await fetch(url, {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/vnd.github+json' }
                    });
                    lastNetworkError = null;
                    break;
                } catch (networkError) {
                    lastNetworkError = networkError;
                    githubLogMsg(`⚠️ Error de red/CORS (intento ${attempt}/3): ${networkError.message}`, 'error');
                    if (attempt < 3) await sleep(800 * attempt);
                }
            }
            if (lastNetworkError) {
                throw new Error(`No se pudo conectar con GitHub: ${lastNetworkError.message}`);
            }
            githubLogMsg(`HTTP ${response.status} ${response.statusText}`);
            if (!response.ok) {
                let detail = '';
                try {
                    const data = await response.json();
                    detail = data.message ? ` — ${data.message}` : '';
                } catch (_) {}
                githubLogMsg(`FALLÓ carpeta /${path}/ → HTTP ${response.status}${detail}`, 'error');
                if (response.status === 404) {
                    throw new Error(`GitHub respondió 404 al leer /${path}/. Revisa que el repositorio, rama y carpeta existan y sean públicos.`);
                }
                throw new Error(`GitHub respondió HTTP ${response.status} al leer /${path}/${detail}`);
            }
            const data = await response.json();
            if (!Array.isArray(data)) throw new Error(`GitHub respondió algo que no es una carpeta para /${path}/.`);
            githubLogMsg(`✓ Carpeta encontrada /${path}/ — ${data.length} elementos`, 'ok');
            for (const item of data) githubLogMsg(`   ${item.type === 'dir' ? '📁' : '📄'} ${item.path}`);
            return data;
        }

        async function githubCollectFiles(path, result, foldersRead) {
            foldersRead.push(path);
            const items = await githubListFolder(path);
            for (const item of items) {
                if (item.type === 'file') {
                    result.push({
                        path: item.path,
                        size: Number(item.size) || 0,
                        download_url: item.download_url || `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${item.path.split('/').map(encodeURIComponent).join('/')}`
                    });
                } else if (item.type === 'dir') {
                    await githubCollectFiles(item.path, result, foldersRead);
                }
            }
        }

        // ============ VERSION + CACHÉ LOCAL DE RECURSOS ============
        // La versión se consulta directamente desde raw.githubusercontent.com, sin usar la API.
        // Los archivos ya descargados se guardan en IndexedDB. Si la versión no cambia,
        // el juego reutiliza los recursos guardados y evita volver a descargar todo.
        const GAME_CACHE_DB = 'ElBromasGameCacheV2';
        const GAME_CACHE_STORE = 'files';
        let currentGameVersion = 'sin-version';

        function openGameCache() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(GAME_CACHE_DB, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(GAME_CACHE_STORE)) {
                        db.createObjectStore(GAME_CACHE_STORE, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error || new Error('No se pudo abrir el caché local.'));
            });
        }

        async function cacheGet(key) {
            try {
                const db = await openGameCache();
                return await new Promise((resolve, reject) => {
                    const req = db.transaction(GAME_CACHE_STORE, 'readonly').objectStore(GAME_CACHE_STORE).get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (_) { return null; }
        }

        async function cachePut(record) {
            try {
                const db = await openGameCache();
                await new Promise((resolve, reject) => {
                    const req = db.transaction(GAME_CACHE_STORE, 'readwrite').objectStore(GAME_CACHE_STORE).put(record);
                    req.onsuccess = resolve;
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { console.warn('No se pudo guardar caché:', e); }
        }

        async function cacheClearOldVersions(version) {
            try {
                const db = await openGameCache();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(GAME_CACHE_STORE, 'readwrite');
                    const store = tx.objectStore(GAME_CACHE_STORE);
                    const req = store.openCursor();
                    req.onsuccess = () => {
                        const cursor = req.result;
                        if (!cursor) return;
                        const value = cursor.value;
                        if (value && value.version && value.version !== version) cursor.delete();
                        cursor.continue();
                    };
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch (_) {}
        }

        async function fetchVersionDirect() {
            const candidates = [
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/Version`,
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/Version.txt`,
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/version.txt`,
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodeURIComponent(GITHUB_FOLDER)}/Version`,
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodeURIComponent(GITHUB_FOLDER)}/Version.txt`
            ];
            for (const url of candidates) {
                try {
                    const r = await fetch(url, { cache: 'no-store' });
                    if (r.ok) {
                        const text = (await r.text()).trim();
                        if (text) return text;
                    }
                } catch (_) {}
            }
            return null;
        }

        async function getGameVersion() {
            const remote = await fetchVersionDirect();
            const saved = localStorage.getItem('ElBromas_GameVersion');
            if (remote) {
                currentGameVersion = remote;
                if (saved && saved !== remote) {
                    githubLogMsg(`🔄 VERSION CAMBIÓ: ${saved} → ${remote}. Se actualizarán y guardarán los recursos.`, 'ok');
                    await cacheClearOldVersions(remote);
                } else if (saved === remote) {
                    githubLogMsg(`♻️ Versión ${remote}: se intentará usar el caché guardado.`, 'ok');
                } else {
                    githubLogMsg(`🆕 Versión detectada: ${remote}.`, 'ok');
                }
                localStorage.setItem('ElBromas_GameVersion', remote);
            } else {
                currentGameVersion = saved || 'sin-version';
                githubLogMsg(`⚠️ No se encontró archivo Version; se usará ${currentGameVersion}.`);
            }
            return currentGameVersion;
        }

        async function loadCachedGameFiles() {
            const meta = await cacheGet(`meta:${currentGameVersion}`);
            if (!meta || !Array.isArray(meta.paths) || !meta.paths.length) return null;
            const files = [];
            for (const path of meta.paths) {
                const rec = await cacheGet(`file:${currentGameVersion}:${path}`);
                if (!rec || !rec.blob) return null;
                const fileName = path.split('/').pop();
                const file = new File([rec.blob], fileName, { type: rec.type || 'application/octet-stream', lastModified: rec.lastModified || Date.now() });
                Object.defineProperty(file, 'webkitRelativePath', { value: path, configurable: true });
                files.push(file);
            }
            return files;
        }

        // A diferencia de loadCachedGameFiles (que exige que TODOS los archivos
        // de la versión estén completos), esto junta cualquier archivo que ya
        // se haya descargado y guardado para esa versión, aunque la descarga
        // se haya cortado a la mitad. Sirve para "Reintentar" (retomar donde
        // quedó) y para "Jugar sin descargar" (usar lo que ya se bajó).
        async function cacheGetAllFilesForVersion(version) {
            return new Promise(async (resolve) => {
                try {
                    const db = await openGameCache();
                    const tx = db.transaction(GAME_CACHE_STORE, 'readonly');
                    const store = tx.objectStore(GAME_CACHE_STORE);
                    const req = store.openCursor();
                    const files = [];
                    const prefix = `file:${version}:`;
                    req.onsuccess = () => {
                        const cursor = req.result;
                        if (!cursor) { resolve(files); return; }
                        const rec = cursor.value;
                        if (rec && rec.key && rec.key.indexOf(prefix) === 0 && rec.blob) {
                            const path = rec.path;
                            const fileName = path.split('/').pop();
                            const file = new File([rec.blob], fileName, { type: rec.type || 'application/octet-stream', lastModified: rec.lastModified || Date.now() });
                            Object.defineProperty(file, 'webkitRelativePath', { value: path, configurable: true });
                            files.push(file);
                        }
                        cursor.continue();
                    };
                    req.onerror = () => resolve(files);
                } catch (_) { resolve([]); }
            });
        }

        async function saveGameFilesToCache(files, onProgress) {
            if (!files || !files.length) return;
            // Pide que el navegador no borre este almacenamiento automáticamente
            // por poco espacio (equivalente a lo que hace Chrome con IndexedDB).
            try {
                if (navigator.storage && navigator.storage.persist) {
                    const granted = await navigator.storage.persist();
                    githubLogMsg(granted ? '🔒 Almacenamiento persistente concedido.' : '⚠️ Almacenamiento persistente no concedido (puede borrarse si el sistema necesita espacio).');
                }
            } catch (_) {}
            const paths = [];
            let done = 0;
            for (const file of files) {
                const path = file.webkitRelativePath || file.name;
                paths.push(path);
                githubLogMsg(`📦 Instalando: ${path}`);
                await cachePut({
                    key: `file:${currentGameVersion}:${path}`,
                    version: currentGameVersion,
                    path,
                    blob: file,
                    type: file.type,
                    lastModified: file.lastModified
                });
                done++;
                if (onProgress) onProgress(done, files.length, path);
            }
            await cachePut({ key: `meta:${currentGameVersion}`, version: currentGameVersion, paths, savedAt: Date.now() });
            githubLogMsg(`💾 Instalación completa: ${files.length} archivos guardados para la versión ${currentGameVersion}.`, 'ok');
        }

        async function loadGitHubZipFallback(reason) {
            const zipUrl = `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/archive/refs/heads/${encodeURIComponent(GITHUB_BRANCH)}.zip`;
            githubLogMsg(`⚠️ ${reason}`, 'error');
            githubLogMsg(`Usando respaldo ZIP de GitHub para evitar el límite de la API...`);
            githubLogMsg(`ZIP: ${zipUrl}`);
            setGitHubProgress(0, 'Descargando respaldo de GitHub...', 'Conexión directa al ZIP');

            if (typeof JSZip === 'undefined') {
                githubLogMsg('⚠️ JSZip no estaba disponible. Intentando cargar el lector ZIP desde otro CDN...');
                await new Promise((resolve, reject) => {
                    const sc = document.createElement('script');
                    sc.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
                    sc.onload = resolve;
                    sc.onerror = () => reject(new Error('No se pudo cargar el lector ZIP desde los CDNs.'));
                    document.head.appendChild(sc);
                });
            }
            if (typeof JSZip === 'undefined') throw new Error('No se pudo cargar el lector ZIP.');

            const response = await fetch(zipUrl, { cache: 'no-store' });
            githubLogMsg(`ZIP HTTP ${response.status} ${response.statusText}`);
            if (!response.ok) throw new Error(`No se pudo descargar el respaldo ZIP: HTTP ${response.status}`);

            const total = Number(response.headers.get('content-length')) || 0;
            let arrayBuffer;
            if (response.body) {
                const reader = response.body.getReader();
                const chunks = [];
                let loaded = 0;
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.byteLength;
                    const part = total ? loaded / total : 0;
                    setGitHubProgress(part * 35, 'Descargando respaldo de GitHub...',
                        total ? `${(loaded / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB` : `${(loaded / 1048576).toFixed(1)} MB`);
                }
                const merged = new Uint8Array(loaded);
                let offset = 0;
                for (const chunk of chunks) { merged.set(chunk, offset); offset += chunk.length; }
                arrayBuffer = merged.buffer;
            } else {
                arrayBuffer = await response.arrayBuffer();
                setGitHubProgress(35, 'Descarga ZIP completada...', 'Procesando ZIP');
            }

            githubLogMsg('📦 Abriendo ZIP...');
            const zip = await JSZip.loadAsync(arrayBuffer);
            const prefix = `${GITHUB_REPO}-${GITHUB_BRANCH}/`;
            const targetPrefix = `${prefix}${GITHUB_FOLDER}/`;
            const zipEntries = Object.values(zip.files).filter(entry =>
                !entry.dir && entry.name.startsWith(targetPrefix)
            );

            if (!zipEntries.length) {
                const available = Object.values(zip.files)
                    .filter(e => e.name.startsWith(prefix))
                    .map(e => e.name.slice(prefix.length).split('/')[0])
                    .filter(Boolean);
                const unique = [...new Set(available)];
                throw new Error(`El ZIP no contiene /${GITHUB_FOLDER}/. Carpetas encontradas: ${unique.join(', ') || '(ninguna)'}`);
            }

            githubLogMsg(`✅ Encontrada /${GITHUB_FOLDER}/ dentro del ZIP`, 'ok');
            githubLogMsg(`Archivos encontrados: ${zipEntries.length}`);
            const virtualFiles = [];

            for (let i = 0; i < zipEntries.length; i++) {
                const entry = zipEntries[i];
                const relativePath = entry.name.slice(prefix.length);
                const fileName = relativePath.split('/').pop();
                const blob = await entry.async('blob');
                const file = new File([blob], fileName, {
                    type: blob.type || 'application/octet-stream',
                    lastModified: Date.now()
                });
                Object.defineProperty(file, 'webkitRelativePath', {
                    value: relativePath,
                    configurable: true
                });
                virtualFiles.push(file);

                const p = 35 + ((i + 1) / zipEntries.length) * 63;
                setGitHubProgress(p, `Extrayendo ${relativePath}`, `${i + 1} / ${zipEntries.length} archivos`);
                if (i % 10 === 0) await new Promise(requestAnimationFrame);
            }

        async function loadGitHubAssets() {

            githubLoader.dataset.loading = '1';
            githubLoader.style.display = 'none';
            githubLoaderError.style.display = 'none';
            startScreen.classList.remove('ready','error');

            githubRetryBtn.style.display = 'none';
            playOfflineBtn.style.display = 'none';

            githubLogMsg(`Repositorio: https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}`);
            githubLogMsg(`Rama: ${GITHUB_BRANCH}`);
            githubLogMsg(`Ruta raíz del repositorio: /`);
                        githubLogMsg(`URL raíz: ${GITHUB_CONTENTS_URL}?ref=${encodeURIComponent(GITHUB_BRANCH)}`);
            setGitHubProgress(0, 'Iniciando...', '0/0');

            try {
                // Primero revisamos Version y el caché. Esto evita la API de GitHub en cargas posteriores.
                if (await tryCachedGame()) return;
                setGitHubProgress(0, 'Iniciando...', '0/0');
                const rootItems = await githubListFolder('');
                const bromas = rootItems.find(item => item.type === 'dir' && item.name.toLowerCase() === GITHUB_FOLDER.toLowerCase());
                if (!bromas) {
                    const dirs = rootItems.filter(item => item.type === 'dir').map(item => item.name);
                    githubLogMsg(`❌ No se encontró /${GITHUB_FOLDER}/ en la raíz. Carpetas encontradas: ${dirs.join(', ') || '(ninguna)'}`, 'error');
                    throw new Error(`No existe la carpeta "${GITHUB_FOLDER}" en la raíz del repositorio. Carpetas encontradas: ${dirs.join(', ') || '(ninguna)'}`);
                }
                githubLogMsg(`✅ Encontrada /${bromas.name}/ en la raíz`, 'ok');

                const entries = [];
                const foldersRead = [];
                await githubCollectFiles(bromas.path, entries, foldersRead);
                githubLogMsg(`FINALIZÓ LECTURA DEL GIT: ${foldersRead.length} carpetas, ${entries.length} archivos`, 'ok');
                githubLogMsg(`Carpetas leídas: ${foldersRead.map(x => '/' + x + '/').join(', ')}`);
                if (!entries.length) throw new Error(`No se encontraron archivos dentro de /${GITHUB_FOLDER}/.`);

                entries.sort((a, b) => a.size - b.size);
                const virtualFiles = [];
                let completed = 0;

                for (const entry of entries) {
                    const relativePath = entry.path;
                    const fileName = relativePath.split('/').pop();
                    const baseProgress = completed / entries.length * 100;
                    const stepProgress = 100 / entries.length;

                    // Si este archivo ya se descargó en un intento anterior (o hace un
                    // momento, antes de que fallara otro archivo), lo reutiliza en vez
                    // de volver a descargarlo. Esto es lo que permite "retomar" al
                    // reintentar en vez de empezar todo desde 0.

                        Object.defineProperty(file, 'webkitRelativePath', { value: relativePath, configurable: true });
                        virtualFiles.push(file);
                        completed++;
                        githubLogMsg(`♻️ Ya estaba descargado, retomando: ${relativePath}`, 'ok');
                        setGitHubProgress(completed / entries.length * 100, `✓ Ya tenías: ${fileName}`, `${completed} / ${entries.length} archivos`);
                        continue;
                    }

                    setGitHubProgress(baseProgress, `Leyendo ${relativePath}`, `${completed} / ${entries.length} archivos`);
                    const blob = await fetchBlobWithProgress(entry.download_url, part => {
                        setGitHubProgress(baseProgress + part * stepProgress, `Leyendo ${relativePath}`, `${completed} / ${entries.length} archivos`);
                    });
                    // Guarda el archivo en IndexedDB inmediatamente al terminar de bajarlo,
                    // no hasta el final de todo, para no perder el progreso si algo falla después.
                    await cachePut({
                        key: `file:${currentGameVersion}:${relativePath}`,
                        version: currentGameVersion,
                        path: relativePath,

                        type: blob.type || 'application/octet-stream',

                    const file = new File([blob], fileName, { type: blob.type || 'application/octet-stream', lastModified: Date.now() });
                    Object.defineProperty(file, 'webkitRelativePath', { value: relativePath, configurable: true });
                    virtualFiles.push(file);
                    completed++;
                    setGitHubProgress(completed / entries.length * 100, `✓ Leído: ${fileName}`, `${completed} / ${entries.length} archivos`);
                }

                await finishLoadedFiles(virtualFiles, 'GitHub');
            } catch (error) {
                console.error('Error cargando recursos de GitHub:', error);
                const msg = error?.message || String(error);

                // Si el error aparece cuando ya avanzamos bastante, NO hacemos otra
                // descarga. Entramos directamente en el mismo flujo de "JUGAR".
                if (typeof currentLoadProgress === 'number' && currentLoadProgress >= 80) {
                    try {

                    } catch (_) {}
                }

                // En errores tempranos sí probamos una sola alternativa silenciosa.
                try {

                } catch (zipError) {

                    if (startupProgressBar) startupProgressBar.style.width = '0%';
                    if (startupProgressPercent) startupProgressPercent.textContent = 'Error';
                    if (startupProgressCount) startupProgressCount.textContent = '0/0';
                    githubLoader.style.display = 'none';
                }
            } finally {
                githubLoader.dataset.loading = '0';
            }
        }

                    const ideal = new THREE.Vector3(character.position.x + Math.sin(cameraTheta) * cameraDistance, character.position.y + 5, character.position.z + Math.cos(cameraTheta) * cameraDistance); camera.position.lerp(ideal, 0.05); camera.lookAt(character.position);
                    if (cinematicTimer > 60) { isCinematic = false; asteroidRainTimer = 7200; document.getElementById('statusText').style.display = 'none'; joystickVector = {x:0, y:0}; }
                }
            } else if (morteroActive) {
                morteroTimeLeft -= 1/60; const mt = document.getElementById('morteroTimer'); if (mt) mt.textContent = 'Mortero: ' + Math.max(0, morteroTimeLeft).toFixed(1) + 's';
                if (morteroTimeLeft <= 0) { if (window.endMortero) window.endMortero(); }
                if (!isDead && !isKnockedBack) character.rotation.y = cameraTheta;
                const nalgasPos = new THREE.Vector3(); if (character.userData.nalgasGroup) { character.userData.nalgasGroup.getWorldPosition(nalgasPos); } else { nalgasPos.copy(character.position); nalgasPos.y += 1.5; }
                const idealCam = new THREE.Vector3(character.position.x + Math.sin(cameraTheta) * cameraDistance, character.position.y + 20, character.position.z + Math.cos(cameraTheta) * cameraDistance);
                camera.position.lerp(idealCam, 0.12); const lookTarget = new THREE.Vector3(character.position.x - Math.sin(cameraTheta) * 6, character.position.y + 2.2 + Math.sin(cameraPhi) * 10, character.position.z - Math.cos(cameraTheta) * 6); camera.lookAt(lookTarget);
                if (isMorteroFiring && !isDead) { morteroFireTimer--; if (morteroFireTimer <= 0) { morteroFireTimer = 10; playPedoSound(); const from = nalgasPos.clone(); const dir = new THREE.Vector3(); camera.getWorldDirection(dir); spawnCacaFromNalgas(from, Math.atan2(dir.x, dir.z), 0.55, 2); spawnGreenSmoke(from, 1, false); } }
            } else {
                const targetPos = new THREE.Vector3(character.position.x, character.position.y + 2.5, character.position.z);
                let idealX = targetPos.x + cameraDistance * Math.sin(cameraPhi) * Math.sin(cameraTheta); let idealY = targetPos.y + cameraDistance * Math.cos(cameraPhi); let idealZ = targetPos.z + cameraDistance * Math.sin(cameraPhi) * Math.cos(cameraTheta);
                const dir = new THREE.Vector3(idealX - targetPos.x, idealY - targetPos.y, idealZ - targetPos.z).normalize();
                
                let finalDistance = cameraDistance; const raycaster = new THREE.Raycaster(targetPos, dir, 0, cameraDistance);
                const obstacles = buildingColliders.map(c => c.group.children[0]).filter(m => m); const intersects = raycaster.intersectObjects(obstacles, false);
                if (intersects.length > 0) { finalDistance = Math.max(2, intersects[0].distance - 0.8); }
                
                idealX = targetPos.x + finalDistance * Math.sin(cameraPhi) * Math.sin(cameraTheta); idealY = targetPos.y + finalDistance * Math.cos(cameraPhi); idealZ = targetPos.z + finalDistance * Math.sin(cameraPhi) * Math.cos(cameraTheta);
                
                const floorY = getTerrainY(idealX, idealZ, null);
                if (idealY < floorY + 0.8) idealY = floorY + 0.8;

                camera.position.lerp(new THREE.Vector3(idealX, idealY, idealZ), 0.15); camera.lookAt(targetPos);
                if (window.playerLight) { window.playerLight.position.copy(character.position); window.playerLight.position.y += 5; }
                if (windowScreenShake > 0) { camera.position.x += (Math.random() - 0.5) * windowScreenShake; camera.position.y += (Math.random() - 0.5) * windowScreenShake; camera.position.z += (Math.random() - 0.5) * windowScreenShake; windowScreenShake *= 0.9; if (windowScreenShake < 0.1) windowScreenShake = 0; }
            }
            renderer.render(scene, camera);
        }
        
        function updateDayNight() {
            const t = timeOfDay;
            const stops = [
                { t: 0.00, sky: 0x020412, sun: 0x050511, amb: 0x0a0c1a, sunInt: 0.0, lampInt: 1.0, winInt: 1.0, winCol: 0xffdd88 },
                { t: 0.20, sky: 0x020412, sun: 0x050511, amb: 0x0a0c1a, sunInt: 0.0, lampInt: 1.0, winInt: 1.0, winCol: 0xffdd88 },
                { t: 0.25, sky: 0x221133, sun: 0xff3300, amb: 0x221122, sunInt: 0.3, lampInt: 0.8, winInt: 0.8, winCol: 0xffaa55 },
                { t: 0.30, sky: 0xff7744, sun: 0xffaa55, amb: 0x442222, sunInt: 0.8, lampInt: 0.2, winInt: 0.4, winCol: 0x555555 },
                { t: 0.35, sky: 0x87CEEB, sun: 0xffeedd, amb: 0x556688, sunInt: 1.2, lampInt: 0.0, winInt: 0.2, winCol: 0x222222 },
                { t: 0.50, sky: 0x44aaff, sun: 0xffffff, amb: 0x667799, sunInt: 1.5, lampInt: 0.0, winInt: 0.2, winCol: 0x222222 },
                { t: 0.65, sky: 0x87CEEB, sun: 0xffeedd, amb: 0x556688, sunInt: 1.2, lampInt: 0.0, winInt: 0.2, winCol: 0x222222 },
                { t: 0.70, sky: 0xff5522, sun: 0xff8800, amb: 0x442222, sunInt: 0.8, lampInt: 0.2, winInt: 0.4, winCol: 0x555555 },
                { t: 0.75, sky: 0x221133, sun: 0xff3300, amb: 0x221122, sunInt: 0.3, lampInt: 0.8, winInt: 0.8, winCol: 0xffaa55 },
                { t: 0.80, sky: 0x020412, sun: 0x050511, amb: 0x0a0c1a, sunInt: 0.0, lampInt: 1.0, winInt: 1.0, winCol: 0xffdd88 },
                { t: 1.00, sky: 0x020412, sun: 0x050511, amb: 0x0a0c1a, sunInt: 0.0, lampInt: 1.0, winInt: 1.0, winCol: 0xffdd88 }
            ];

            let s1 = stops[0], s2 = stops[stops.length - 1];
            for (let i = 0; i < stops.length - 1; i++) { if (t >= stops[i].t && t <= stops[i+1].t) { s1 = stops[i]; s2 = stops[i+1]; break; } }
            const range = s2.t - s1.t; const factor = range > 0 ? (t - s1.t) / range : 0;
            const skyCol = new THREE.Color(s1.sky).lerp(new THREE.Color(s2.sky), factor); const sunCol = new THREE.Color(s1.sun).lerp(new THREE.Color(s2.sun), factor); const ambCol = new THREE.Color(s1.amb).lerp(new THREE.Color(s2.amb), factor); const winCol = new THREE.Color(s1.winCol).lerp(new THREE.Color(s2.winCol), factor);
            const sunInt = s1.sunInt + (s2.sunInt - s1.sunInt) * factor; const lampInt = s1.lampInt + (s2.lampInt - s1.lampInt) * factor; const winInt = s1.winInt + (s2.winInt - s1.winInt) * factor;

            scene.background.copy(skyCol); scene.fog.color.copy(skyCol);
            if (window.sunLight) { window.sunLight.intensity = sunInt; window.sunLight.color.copy(sunCol); const sunAngle = (t - 0.25) * Math.PI * 2; window.sunLight.position.set(Math.cos(sunAngle) * 130, Math.sin(sunAngle) * 130, 50); }
            if (window.ambientLight) { window.ambientLight.intensity = 1.0; window.ambientLight.color.copy(ambCol); }
            if (window.hemiLight) { window.hemiLight.intensity = (sunInt * 0.3) + 0.1; }
            if (window.playerLight) { window.playerLight.intensity = lampInt * 1.5; }

            sharedBuildingMaterials.forEach(m => { m.emissiveIntensity = winInt; m.emissive.copy(winCol); });
            if (window.stars) { window.stars.material.opacity = lampInt; window.stars.visible = lampInt > 0.05; }
        }
        
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('resize', () => { if (camera && renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } });
        // Al abrir el HTML se ejecuta automáticamente la misma función que antes
        // hacía el botón "CARGAR RECURSOS". No se muestra ningún log.
        window.addEventListener('DOMContentLoaded', () => {
            enterFullscreen();
            setTimeout(() => loadGitHubAssets(), 120);
            const unlockAudio = () => {
                enterFullscreen();
                if (filesLoaded && musicTracks.length) playMusic();
            };
            document.addEventListener('pointerdown', unlockAudio, { once:true });
            document.addEventListener('touchstart', unlockAudio, { once:true, passive:true });
        });
    </script>
